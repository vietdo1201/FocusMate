name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOCUSMATE_RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
      FOCUSMATE_RELEASE_STORE_PASSWORD: ${{ secrets.FOCUSMATE_RELEASE_STORE_PASSWORD }}
      FOCUSMATE_RELEASE_KEY_ALIAS: ${{ secrets.FOCUSMATE_RELEASE_KEY_ALIAS }}
      FOCUSMATE_RELEASE_KEY_PASSWORD: ${{ secrets.FOCUSMATE_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSMATE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FOCUSMATE_RELEASE_STORE_FILE"
          chmod 600 "$FOCUSMATE_RELEASE_STORE_FILE"
      - name: Build and test signed APK
        working-directory: soucre_code/from_On_Hand_3_android_wear
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify APK signature
        shell: bash
        run: |
          APK="soucre_code/from_On_Hand_3_android_wear/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "FocusMate-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "FocusMate-${GITHUB_REF_NAME}.apk" --verify-tag --generate-notes
