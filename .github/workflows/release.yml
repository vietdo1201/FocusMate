name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOCUSMATE_RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
      FOCUSMATE_RELEASE_STORE_PASSWORD: ${{ secrets.FOCUSMATE_RELEASE_STORE_PASSWORD }}
      FOCUSMATE_RELEASE_KEY_ALIAS: ${{ secrets.FOCUSMATE_RELEASE_KEY_ALIAS }}
      FOCUSMATE_RELEASE_KEY_PASSWORD: ${{ secrets.FOCUSMATE_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate immutable release identity
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v2.2.0"
          grep -F 'versionCode     = 23' wear/app/build.gradle.kts
          grep -F 'versionName     = "2.2.0"' wear/app/build.gradle.kts
          grep -F 'set(PROJECT_VER "2.2.0")' firmware/CMakeLists.txt
      - name: Restore release keystore without logging secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSMATE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set +x
          test -n "$KEYSTORE_BASE64"
          test -n "$FOCUSMATE_RELEASE_STORE_PASSWORD"
          test -n "$FOCUSMATE_RELEASE_KEY_ALIAS"
          test -n "$FOCUSMATE_RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FOCUSMATE_RELEASE_STORE_FILE"
      - name: Build, test and sign Wear APK
        run: |
          python -m pip install --disable-pip-version-check reuse==6.2.0 charset-normalizer==3.4.3
          python tools/bootstrap_assets.py
          python tools/generate_sbom.py
          python tools/check_compliance.py
          python -m reuse lint
          python tools/verify.py --no-firmware --no-assets
      - name: Build merged ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o FocusMate-ESP32S3-v2.2.0.bin @flash_args
      - name: Verify and stage open release artifacts
        shell: bash
        run: |
          set +x
          mkdir -p release-assets
          APK="wear/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > release-assets/APK-SIGNATURE.txt
          keytool -exportcert -rfc \
            -keystore "$FOCUSMATE_RELEASE_STORE_FILE" \
            -storepass "$FOCUSMATE_RELEASE_STORE_PASSWORD" \
            -alias "$FOCUSMATE_RELEASE_KEY_ALIAS" \
            > release-assets/FocusMate-release-cert.pem
          cp "$APK" release-assets/FocusMate-Wear-v2.2.0.apk
          cp firmware/build/FocusMate-ESP32S3-v2.2.0.bin release-assets/
          cp sbom/focusmate-v2.2.0.spdx.json release-assets/
          cp THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.txt
          (cd release-assets && sha256sum APK-SIGNATURE.txt FocusMate-* focusmate-v2.2.0.spdx.json THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt)
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Publish release only after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --draft --title "FocusMate v2.2.0" \
            --notes-file docs/RELEASE_NOTES_v2.2.0.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
