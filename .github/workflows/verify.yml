name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify firmware and Web contracts
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/*.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify protocol and Wear app
        working-directory: soucre_code/from_On_Hand_3_android_wear
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
